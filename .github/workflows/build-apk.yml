

name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name baghdad_pharmacy_app .
          fi
          python3 -c '
          import glob, re
          for path in glob.glob("android/**/build.gradle*", recursive=True) + glob.glob("android/**/settings.gradle*", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r"ext\.kotlin_version\s*=\s*[\x27\"][^\x27\"]+[\x27\"]", "ext.kotlin_version = \x271.9.24\x27", s)
              s = re.sub(r"(id\s+[\x27\"]org\.jetbrains\.kotlin\.android[\x27\"]\s+version\s+)[\x27\"][^\x27\"]+[\x27\"]", r"\g<1>\x271.9.24\x27", s)
              s = re.sub(r"(com\.android\.tools\.build:gradle:)[^\x27\"\s]+", r"\g<1>8.3.2", s)
              s = re.sub(r"(id\s+[\x27\"]com\.android\.application[\x27\"]\s+version\s+)[\x27\"][^\x27\"]+[\x27\"]", r"\g<1>\x278.3.2\x27", s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baghdad-pharmacy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
